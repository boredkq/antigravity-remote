name: Build Antigravity Mobile Apps

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build-android:
    name: Build Native Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Mobile Dependencies
        run: |
          cd mobile
          npm install

      - name: Sync Web Assets to Capacitor
        run: |
          cd mobile
          mkdir -p www
          cp -R index.html manifest.json src www/
          npx cap sync android

      - name: Build Capacitor Android APK
        run: |
          cd mobile/android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Antigravity-Remote-Android-APK
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk

  build-ios:
    name: Build Native iOS Application
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Mobile Dependencies
        run: |
          cd mobile
          npm install

      - name: Sync Web Assets to Capacitor iOS
        run: |
          cd mobile
          mkdir -p www
          cp -R index.html manifest.json src www/
          npx cap sync ios

      - name: Build iOS App Package
        run: |
          cd mobile/ios/App
          if [ -d "App.xcworkspace" ]; then
            xcodebuild -workspace App.xcworkspace -scheme App -configuration Debug -sdk iphonesimulator -derivedDataPath build CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO
          else
            xcodebuild -project App.xcodeproj -scheme App -configuration Debug -sdk iphonesimulator -derivedDataPath build CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO
          fi

      - name: Package iOS Simulator App
        run: |
          cd mobile/ios/App/build/Build/Products/Debug-iphonesimulator
          mkdir -p Payload
          cp -r App.app Payload/
          zip -r AntigravityRemote-iOS.ipa Payload

      - name: Upload iOS App Package Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Antigravity-Remote-iOS-IPA
          path: mobile/ios/App/build/Build/Products/Debug-iphonesimulator/AntigravityRemote-iOS.ipa
