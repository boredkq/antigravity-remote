name: antigravity_remote
description: Native Flutter Mobile Remote Control App for Google Antigravity (iOS & Android)
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  web_socket_channel: ^2.4.1
  http: ^1.2.0
  provider: ^6.1.2
  flutter_markdown: ^0.7.1
  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
